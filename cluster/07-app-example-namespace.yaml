apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-example-namespace
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    - name: local-path-provisioner
  wait: true
  path: ./components/app-example-namespace
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system