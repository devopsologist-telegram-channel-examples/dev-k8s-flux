apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
    name: metallb-install
    namespace: flux-system
spec:
    interval: 1m0s
    path: ./components/metallb-install
    dependsOn:
        - name: prometheus-operator-crds
    prune: true
    wait: true
    sourceRef:
        kind: GitRepository
        name: flux-system