apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    - name: letsencrypt
  path: ./components/local-path-provisioner
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system