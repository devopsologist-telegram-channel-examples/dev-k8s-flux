apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  interval: 1m0s
  dependsOn:
    - name: metallb-install
  path: ./components/metallb-config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system