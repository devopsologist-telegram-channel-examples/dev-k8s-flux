apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  interval: 1m0s
  dependsOn:
    - name: app-example
  wait: true
  path: ./components/loki
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system