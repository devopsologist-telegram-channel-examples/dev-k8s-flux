apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: loki
spec:
  interval: 1m0s
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: loki
spec:
  chart:
    spec:
      chart: loki
      sourceRef:
        kind: HelmRepository
        name: grafana
      version: '6.29.0'
  interval: 1m0s
  values:
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
      persistence:
        size: 10Gi
        storageClass: local-path
      extraArgs:
        - -config.expand-env=true
      extraEnvFrom:
        - secretRef:
            name: loki-envs
    lokiCanary:
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
    resultsCache:
      allocatedMemory: 512
      resources:
        limits:
          cpu: 500m
          memory: 615Mi
        requests:
          cpu: 100m
          memory: 615Mi
    chunksCache:
      allocatedMemory: 512
      resources:
        limits:
          cpu: 500m
          memory: 615Mi
        requests:
          cpu: 100m
          memory: 615Mi
    gateway:
      deploymentStrategy:
        type: Recreate
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
    # Zero out replica counts of other deployment modes
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage_config:
        aws:
          s3: ${S3_LOKI_DSN}
          s3forcepathstyle: true
          insecure: ${S3_LOKI_INSECURE}
          bucketnames: loki-dev-chunks,loki-dev-ruler,loki-dev-admin
      storage:
        bucketNames:
          chunks: loki-chunks
          ruler: loki-ruler
          admin: loki-admin
        type: s3
        s3:
          s3: ${S3_LOKI_DSN}
          endpoint: ${S3_LOKI_ENDPOINT}
          region: ${S3_LOKI_REGION}
          secretAccessKey: ${S3_LOKI_SECRET_ACCESS_KEY}
          accessKeyId: ${S3_LOKI_ACCESS_KEY_ID}
          s3ForcePathStyle: true
          insecure: ${S3_LOKI_INSECURE}
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      compactor:
        delete_request_store: s3
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 2h
        retention_delete_worker_count: 150
      ingester:
        chunk_encoding: snappy
      limits_config:
        query_timeout: 600s
        max_query_parallelism: 24
        split_queries_by_interval: 15m
        ingestion_rate_mb: 100
        ingestion_burst_size_mb: 300
        per_stream_rate_limit: "30MB"
        per_stream_rate_limit_burst: "50MB"
        max_global_streams_per_user: 100000
        retention_period: 7d
      server:
        grpc_server_max_recv_msg_size: 104857600 # 100 Mb
        grpc_server_max_send_msg_size: 104857600 # 100 Mb
      querier:
        max_concurrent: 8
      query_range:
        results_cache:
          cache:
            embedded_cache:
              enabled: true
              max_size_mb: 4096